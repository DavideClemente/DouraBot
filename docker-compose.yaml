version: '3'

networks:
    douranetwork:
        driver: bridge
        ipam:
            config:
                - subnet: '172.22.0.0/16'

services:
    mariadoura:
        image: mariadb:latest
        container_name: mariadoura
        networks:
            - douranetwork
        ports:
            - '3306:3306'
        env_file: .env
        volumes:
            - ./mariadb:/var/lib/mysql
        restart: always
        healthcheck:
            test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s

    dourabot:
        depends_on:
            mariadoura:
                condition: service_healthy
        image: davide2707clemente/dourabot:latest
        container_name: dourabot
        networks:
            - douranetwork
        env_file: .env
        restart: on-failure

    watchtower:
        image: containrrr/watchtower
        container_name: watchtower
        restart: unless-stopped
        environment:
            # containrrr/watchtower defaults to Docker API 1.25; modern daemons
            # (Engine 25+) require a newer minimum, so pin a supported version.
            - DOCKER_API_VERSION=1.44
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
        command: --interval 300 --cleanup dourabot
